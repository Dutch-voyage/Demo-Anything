[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sviz"
version = "0.2.0a1"
description = "A portable, domain-neutral systems visualization IR and viewer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sviz contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "networkx>=3.2,<4",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
sviz = "sviz.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sviz"]

[tool.hatch.build]
include = [
  "src/sviz/**/*.py",
  "src/sviz/static/*.js",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
